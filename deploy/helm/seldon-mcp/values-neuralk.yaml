# The Neuralk production deployment: https://mcp.neuralk.ai
#
#   helm upgrade --install seldon-mcp deploy/helm/seldon-mcp \
#     -n seldon-mcp --create-namespace -f deploy/helm/seldon-mcp/values-neuralk.yaml
#
# Only what differs from values.yaml is here. The one thing that never lives in
# git is the `scaleway-registry` pull secret, created out of band — deploy/README.md.

image:
  # Built by .github/workflows/image.yml (linux/amd64). Every build of main
  # carries a main-<sha> tag, so this line maps to a commit and a rollback is a
  # line in a diff. Pin releases here; never deploy :latest.
  tag: main-30c347f

# rg.fr-par.scw.cloud/neuralk-prod is PRIVATE. This secret must exist in the
# release namespace before the pods do (deploy/README.md).
imagePullSecrets:
  - name: scaleway-registry

# OAuth sign-in: SELDON_OAUTH_SECRET and NEURALK_OIDC_CLIENT_SECRET, created
# out of band like the pull secret (deploy/README.md). It must exist before
# the pods do.
existingSecret: seldon-mcp-oauth

config:
  # The confidential client of the Neuralk Keycloak realm behind "Continue
  # with Neuralk" (redirect URI https://mcp.neuralk.ai/oauth/callback). Its
  # login page only takes a password: the page says so to magic-link users.
  NEURALK_OIDC_CLIENT_ID: seldon-mcp
  # "Continue with Neuralk" through the dashboard instead (password or magic
  # link, and one click for someone already signed in to it). Uncomment once
  # the dashboard release with the /connect page is live; it wins over the
  # Keycloak client, which can then be deleted.
  # NEURALK_DASHBOARD_URL: https://prediction.neuralk.ai

ingress:
  enabled: true
  host: mcp.neuralk.ai
  annotations:
    # The issuer the rest of the Neuralk platform uses (DNS-01, Cloudflare).
    cert-manager.io/cluster-issuer: letsencrypt-prod-cloudflare

# Keep the server off the GPU machines. `k8s.scw.cloud/gpu` is Kapsule's own
# label, present on every GPU node and on nothing else, so DoesNotExist means
# "any CPU node" and survives pools being added or renamed.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: k8s.scw.cloud/gpu
              operator: DoesNotExist
