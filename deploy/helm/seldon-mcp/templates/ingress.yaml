{{- if .Values.ingress.enabled }}
{{/*
The single public entry point: the MCP endpoint at / and /mcp, the probes at
/healthz, the single-use prediction files at /downloads. One host, one backend.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "seldon-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "seldon-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "seldon-mcp.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
