[project]
name = "seldon-mcp"
version = "0.2.0"
description = "MCP server for Neuralk's Seldon tabular foundation model"
readme = "README.md"
authors = [
    { name = "Neuralk AI", email = "info@neuralk-ai.com" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["mcp", "llm", "tabular", "machine-learning", "seldon", "neuralk"]
dependencies = [
    "mcp[cli]>=1.2.0",
    "neuralk>=1.2.0",
    "polars>=1.0",
    "scikit-learn>=1.6",
    "pydantic-settings>=2.0",
    "anyio>=4.5",
    "click>=8.0",
    "httpx>=0.27",
    "pyarrow>=14.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "skrub>=0.5",
    "zstandard>=0.22",
    "numpy>=1.26",
    "uvicorn>=0.31",
]

[project.scripts]
seldon-mcp = "seldon_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seldon_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Block real network in tests (all outbound HTTP is mocked). Unix sockets stay
# allowed so the asyncio event loop's self-pipe still works.
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-httpx>=0.30", "pytest-socket>=0.7", "ruff>=0.6"]
