name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Lint
        run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: uv build

      - name: Verify MCP server starts
        env:
          NEURALK_API_KEY: ""
        run: |
          uv run python -c "
          from seldon_mcp.server import mcp
          tools = [t.name for t in mcp._tool_manager.list_tools()]
          expected = {'predict', 'predict_from_data', 'upload_data', 'create_upload', 'complete_upload', 'list_models'}
          assert set(tools) == expected, f'Unexpected tools: {tools}'
          print('Server OK:', tools)
          "
